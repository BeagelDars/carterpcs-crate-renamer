<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crate Renamer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1 class="title">Crate Renamer</h1>
        <span class="badge">CARTER-HERE</span>
      </div>
      <div class="header-actions">
        <button id="btnLoadDemo" class="btn-text">Load sample files</button>
        <button id="btnClear" class="btn-text">Clear</button>
      </div>
    </header>

    <!-- Upload Area -->
    <div id="dropzone" class="dropzone">
      <div class="dropzone-text">
        <p class="dropzone-main">Drop files or folder here</p>
        <p class="dropzone-sub">or click to choose from your PC</p>
      </div>
      <div class="dropzone-btns">
        <label class="btn btn-outline">
          Select Files
          <input type="file" id="filePicker" multiple hidden>
        </label>
        <button id="btnPickFolder" class="btn btn-outline">Select PC Folder</button>
      </div>
    </div>

    <!-- Minimal Settings Bar -->
    <section class="settings-card">
      <div class="settings-row">
        <div class="field-item">
          <label for="prefixInput">Prefix</label>
          <input type="text" id="prefixInput" placeholder="e.g. 01 - ">
        </div>

        <div class="field-item">
          <label for="suffixInput">Suffix</label>
          <input type="text" id="suffixInput" placeholder="e.g. [Pack]">
        </div>

        <div class="field-item">
          <label for="letterCase">Case</label>
          <select id="letterCase">
            <option value="preserve">As is</option>
            <option value="titlecase">Title Case</option>
            <option value="uppercase">UPPERCASE</option>
            <option value="lowercase">lowercase</option>
          </select>
        </div>

        <div class="field-item">
          <label for="carterStyle">CARTER Tag</label>
          <select id="carterStyle">
            <option value="-CARTER-HERE">-CARTER-HERE</option>
            <option value="_CARTER-HERE">_CARTER-HERE</option>
            <option value=" CARTER-HERE"> CARTER-HERE</option>
            <option value="CARTER-HERE">CARTER-HERE</option>
          </select>
        </div>
      </div>

      <div class="toggles-row">
        <label class="checkbox">
          <input type="checkbox" id="cleanSpaces" checked>
          <span>Clean underscores & extra spaces</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="stripJunk" checked>
          <span>Remove [320k], URLs & junk</span>
        </label>
        <div class="carter-lock" id="carterLockBadge" title="CARTER-HERE is always included">
          🔒 CARTER-HERE: Always appended
        </div>
      </div>
    </section>

    <!-- Results / Preview Area -->
    <section id="resultsSection" class="results-card" style="display: none;">
      <div class="results-header">
        <div class="results-count" id="resultsCount">0 files</div>
        <div class="results-actions">
          <button id="btnInPlaceRename" class="btn btn-primary" style="display: none;">Rename in Folder</button>
          <button id="btnDownloadZip" class="btn btn-primary">Download Renamed (ZIP)</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th style="width: 45%;">Original</th>
              <th style="width: 30px;"></th>
              <th>Renamed Preview</th>
              <th style="width: 50px;"></th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Simple Toast -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
